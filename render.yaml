services:
  - type: web
    name: smart-resume-screener
    runtime: python
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0: --workers 1 --threads 4 --timeout 180
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
